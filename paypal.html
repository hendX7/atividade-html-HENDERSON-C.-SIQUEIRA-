
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Comprar Agora - PayPal</title>
    <style>
        * {
            box-sizing: border-box;
        }
        body {
            font-family: Arial, sans-serif;
        }
        #wps-bn {
            text-align: center;
        }
        .overlay {
            position: fixed;
            inset: 0;
            background: rgba(255, 255, 255, 0.88);
            z-index: 9999;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            overflow-y: auto;
            padding: 20px;
        }
        .caixa {
            position: relative;
            margin-top: 15vh;
            width: 530px;
            max-width: 100%;
            padding: 20px 15px;
            text-align: center;
            font: bold 15px Arial, sans-serif;
            color: #2F6395;
            background: linear-gradient(#FFF 45%, #E9ECEF 80%);
            border: 1px solid #CFCFCF;
            border-radius: 6px;
            box-shadow: 0 0 0 5px rgba(0, 0, 0, 0.15);
        }
        .caixa p {
            font-size: 13px;
            line-height: 1.6;
            font-weight: normal;
            color: #003171;
        }
        .caixa img {
            display: block;
            max-width: 100%;
            height: auto;
            margin: 0 auto 10px;
        }
        .caixa .logo {
            margin-top: 25px;
        }
        @media (max-width: 480px) {
            .overlay {
                padding: 15px;
            }
            .caixa {
                margin-top: 10vh;
                padding: 18px 12px;
            }
            .caixa h2 {
                font-size: 19px;
            }
        }
    </style>
</head>
<body>
<form>
    <input type="hidden" name="cmd" value="_xclick">
    <input type="hidden" name="business" value="teste@empresa.com.br">
    <input type="hidden" name="return" value="https://loja.com.br/retorno">
    <input type="hidden" name="cancel_return" value="https://loja.com.br/cancelamento">
    <input type="hidden" name="notify_url" value="https://loja.com.br/notificacao">
    <input type="hidden" name="charset" value="utf-8">
    <input type="hidden" name="lc" value="BR">
    <input type="hidden" name="country_code" value="BR">
    <input type="hidden" name="currency_code" value="BRL">
    <input type="hidden" name="amount" value="172.00">
    <input type="hidden" name="item_name" value="Servico">
    <input type="hidden" name="quantity" value="1">
    <input
        type="image"
        src="https://www.paypalobjects.com/pt_BR/BR/i/btn/btn_buynowCC_LG.gif"
        alt="Comprar agora com PayPal"
    >
</form>
<script>
(function () {
    var formulario = document.getElementById('wps-bn');
    if (!formulario) {
        return;
    }
    formulario.addEventListener('submit', function (e) {
        e.preventDefault();
        // Impede cliques repetidos durante o redirecionamento.
        if (formulario.dataset.enviando === 'true') {
            return;
        }
        formulario.dataset.enviando = 'true';
        var overlay = document.createElement('div');
        overlay.className = 'overlay';
        overlay.setAttribute('role', 'dialog');
        overlay.setAttribute('aria-modal', 'true');
        overlay.setAttribute('aria-live', 'polite');
        overlay.setAttribute('aria-label', 'Redirecionamento para o PayPal');
        var caixa = document.createElement('div');
        caixa.className = 'caixa';
        var carregando = document.createElement('img');
        carregando.src = 'https://www.paypalobjects.com/en_US/i/icon/icon_animated_prog_dkgy_42wx42h.gif';
        carregando.alt = 'Carregando';
        var titulo = document.createElement('h2');
        titulo.textContent = 'Aguarde alguns segundos.';
        var mensagem = document.createElement('p');
        mensagem.textContent =
            'Você está sendo redirecionado para o ambiente do PayPal para finalizar seu pagamento.';
        var logo = document.createElement('img');
        logo.className = 'logo';
        logo.src = 'https://www.paypal-brasil.com.br/logocenter/util/img/logo_paypal.png';
        logo.alt = 'PayPal';
        // Se uma imagem externa falhar, não impede o pagamento.
        [carregando, logo].forEach(function (imagem) {
            imagem.addEventListener('error', function () {
                imagem.style.display = 'none';
            });
        });
        caixa.appendChild(carregando);
        caixa.appendChild(titulo);
        caixa.appendChild(mensagem);
        caixa.appendChild(logo);
        overlay.appendChild(caixa);
        document.body.appendChild(overlay);

        // Envia o formulário sem disparar novamente o evento submit.
        window.setTimeout(function () {
            HTMLFormElement.prototype.submit.call(formulario);
        }, 300);
    });
})();
</script>
</body>
</html>
