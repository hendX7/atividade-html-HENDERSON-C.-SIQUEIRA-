<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro de Alunos</title>
</head>

<body>

    <h1>Cadastro de Alunos</h1>

    <form>

        <label for="nome">Nome do Aluno:</label><br>
        <input type="text" id="nome" name="nome" value="HEND" required>
        <br><br>

        <label for="email">E-mail do Aluno:</label><br>
        <input type="email" id="email" name="email"
               value="@HENDLINDO@gmail.com" required>
        <br><br>

        <label for="senha">Senha de Acesso:</label><br>
        <input type="password" id="senha" name="senha"
               value="HEND" required>
        <br><br>

        <label for="assunto">Assunto:</label><br>
        <select id="assunto" name="assunto">
            <option>Informática</option>
            <option>Atividade</option>
            <option>Dúvida</option>
        </select>
        <br><br>

        <label for="mensagem">Comentário:</label><br>
        <textarea id="mensagem" name="mensagem"
                  placeholder="Digite seu comentário...">SÓ QUERO PAZ</textarea>
        <br><br>

        <label for="telefone">Telefone:</label><br>
        <input type="tel" id="telefone" name="telefone"
               value="0800 1207">
        <br><br>

        <label for="nascimento">Data de Nascimento:</label><br>
        <input type="date" id="nascimento" name="nascimento"
               value="2007-07-07">
        <br><br>

        <input type="submit" value="Cadastrar">
        <input type="reset" value="Apagar">

    </form>

</body>
</html>
